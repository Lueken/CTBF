<style>
/* Self-hosted: type no longer waits on two cross-origin round trips
   (the stylesheet, then the font files) before a word can be styled. */
@font-face { font-family:'Cormorant Garamond'; font-style:normal; font-weight:300 700; font-display:swap;
  src:url(/fonts/cormorant-garamond-normal-latin.woff2) format('woff2'); }
@font-face { font-family:'Cormorant Garamond'; font-style:italic; font-weight:400; font-display:swap;
  src:url(/fonts/cormorant-garamond-italic-latin.woff2) format('woff2'); }
@font-face { font-family:'Karla'; font-style:normal; font-weight:400 800; font-display:swap;
  src:url(/fonts/karla-normal-latin.woff2) format('woff2'); }

/* Metric-matched fallbacks, so the page laid out in a system font occupies
   exactly the space the real face will and nothing moves when it arrives.
   Tier 1 is the Georgia metric group, tier 2 the Times group; between them
   they cover Windows, macOS, iOS and Linux. */
@font-face { font-family:'Cormorant Fallback'; src:local('Georgia'), local('Gelasio');
  size-adjust:89.64%; ascent-override:103.08%; descent-override:32.02%; line-gap-override:0.00%; }
@font-face { font-family:'Cormorant Fallback'; font-style:italic; src:local('Georgia Italic'), local('Gelasio Italic');
  size-adjust:78.98%; ascent-override:116.99%; descent-override:36.34%; line-gap-override:0.00%; }
@font-face { font-family:'Cormorant Fallback2'; src:local('Times New Roman'), local('Liberation Serif'), local('Tinos'), local('Nimbus Roman');
  size-adjust:98.04%; ascent-override:94.25%; descent-override:29.27%; line-gap-override:0.00%; }
@font-face { font-family:'Cormorant Fallback2'; font-style:italic; src:local('Times New Roman Italic'), local('Liberation Serif Italic'), local('Tinos Italic');
  size-adjust:88.01%; ascent-override:104.98%; descent-override:32.61%; line-gap-override:0.00%; }
@font-face { font-family:'Karla Fallback'; src:local('Arial'), local('Liberation Sans'), local('Arimo'), local('Helvetica');
  size-adjust:102.59%; ascent-override:89.39%; descent-override:24.56%; line-gap-override:0.00%; }

/* Pinned so boxes that never set a line-height stop taking it from the font
   metrics in play. That is what moved the hero: the eyebrow, the verse ref and
   the buttons all grew when a fallback stood in, by a different amount on every
   platform. 1.169 is Karla own normal ((1834+504)/2000), so nothing renders
   differently -- measured at 0.22px across the whole hero. */
body { margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center;
  background:#013f52; color:#ffffff; font-family:Karla,Karla Fallback,sans-serif; text-align:center; padding:24px; line-height:1.169; }
p { font-family:Cormorant Garamond,Cormorant Fallback,Cormorant Fallback2,serif; font-size:22px; font-style:italic; margin:0 0 20px; }
a { color:#fde680; font-weight:700; font-size:16px; }
</style>
</head>
